name: "Build"
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      release_action:
        description: "Build artifacts only, or publish a release"
        required: true
        default: "build-only"
        type: choice
        options:
          - "build-only"
          - "publish"
permissions:
  contents: read
jobs:
  luacheck:
    uses: ./.github/workflows/luacheck.yml
  ci:
    uses: ./.github/workflows/ci.yml
  ci-version:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.release_action == 'publish' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
    - name: Set non-release build version
      id: version
      shell: bash
      run: |
        short_sha="$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
        echo "value=1.41.4+ci.${GITHUB_RUN_NUMBER}.${short_sha}" >> "$GITHUB_OUTPUT"

  prepare-release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_action == 'publish' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
      pull-requests: read
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: true
    - name: Verify release baseline
      shell: bash
      run: |
        expected_commit="df0ef29fc07d87966a1a2558ab257743f29efaf4"
        actual_commit="$(git rev-list -n 1 v1.41.4 2>/dev/null || true)"
        if [[ "$actual_commit" != "$expected_commit" ]]; then
          echo "v1.41.4 must point to the qualified upstream commit $expected_commit" >&2
          exit 1
        fi
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "lts/*"
    - name: Install dependencies
      run: npm install
    - name: Preview release version
      id: get-next-version
      run: npx semantic-release --dry-run
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Validate release version
      id: version
      shell: bash
      env:
        RELEASE_TAG: ${{ steps.get-next-version.outputs.new-release-git-tag }}
      run: |
        if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "semantic-release did not produce a valid release tag" >&2
          exit 1
        fi
        release_version="${RELEASE_TAG#v}"
        highest_version="$(printf '%s\n' '1.41.4' "$release_version" | sort -V | tail -n 1)"
        if [[ "$highest_version" != "$release_version" || "$release_version" == "1.41.4" ]]; then
          echo "semantic-release must produce a version newer than 1.41.4" >&2
          exit 1
        fi
        echo "value=$release_version" >> "$GITHUB_OUTPUT"

  build:
    # The build matrix is expensive, so only start it after the tests pass:
    # the ci job runs the full test suite once for this workflow.
    needs: [ci, ci-version, prepare-release]
    if: ${{ always() && needs.ci.result == 'success' && (needs.ci-version.result == 'success' || needs.prepare-release.result == 'success') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        target: ["aarch64", "desktop", "kindle", "kindlehf", "kindlea9"]
        os: [ubuntu-latest]
        include:
          - target: "macos"
            os: macos-14
          # Android is split into parallel jobs, one per ABI: armv7 targets
          # API 18, aarch64/x86_64 target API 21.
          - target: "android-armv7"
            os: ubuntu-latest
            abi: "armv7"
          - target: "android-aarch64"
            os: ubuntu-latest
            abi: "aarch64"
          - target: "android-x86_64"
            os: ubuntu-latest
            abi: "x86_64"

    steps:
    - uses: actions/checkout@v3
      with:
        persist-credentials: false

    - name: Install system deps (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt update && sudo apt install -y pkg-config libfontconfig1-dev libfreetype6-dev podman gettext
        echo "CROSS_CONTAINER_ENGINE=podman" >> $GITHUB_ENV

    - name: Install system deps (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install gettext bash
        echo "$(brew --prefix gettext)/bin" >> $GITHUB_PATH
        echo "$(brew --prefix bash)/bin" >> $GITHUB_PATH

    - name: Cache Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
 
    - name: Cache Podman images
      if: runner.os == 'Linux'
      uses: actions/cache@v4
      with:
        path: |
          ~/.local/share/containers
        key: ${{ runner.os }}-podman-cross-${{ matrix.target }}

    - name: Install Rust 1.97.1
      uses: actions-rs/toolchain@v1
      with:
        toolchain: 1.97.1
        profile: minimal
        components: rustfmt, clippy
        override: true
    
    - name: Install macOS Rust Target
      if: matrix.target == 'macos'
      run: rustup target add aarch64-apple-darwin

    - name: Install cross (Linux)
      if: runner.os == 'Linux'
      run: cargo install cross

    - name: Setup bun
      uses: oven-sh/setup-bun@v2
      with:
        # bun.lock files use the v1 format (stable bun)
        bun-version: 1.3.14

    - name: Cache Rust Dependencies
      uses: swatinem/rust-cache@v2
      with:
        workspaces: "backend -> target"
        prefix-key: "rust-cache-${{ matrix.target }}"

    - name: Build plugin
      env:
        SEMANTIC_RELEASE_VERSION: ${{ needs.prepare-release.outputs.value || needs.ci-version.outputs.value }}
      run: bash scripts/build-all.sh ${{ matrix.target }}
    - name: Package plugin contents
      run: "cd build && zip -r rakuyomi-${{ matrix.target }}.zip rakuyomi.koplugin"
    - name: Upload plugin as workflow artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.target }} build
        path: build/rakuyomi-${{ matrix.target }}.zip

    - uses: actions/setup-java@v4
      if: ${{ startsWith(matrix.target, 'android') }}
      with:
        distribution: temurin
        java-version: 17

    - uses: android-actions/setup-android@v3
      if: ${{ startsWith(matrix.target, 'android') }}

    - name: Install Android NDK (r23b)
      if: ${{ startsWith(matrix.target, 'android') }}
      run: sdkmanager "ndk;23.1.7779620"

    - name: Configure NDK
      if: ${{ startsWith(matrix.target, 'android') }}
      run: |
        echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/23.1.7779620" >> $GITHUB_ENV
        echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/23.1.7779620" >> $GITHUB_ENV
        echo "$ANDROID_SDK_ROOT/ndk/23.1.7779620/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

    - name: Install cargo-ndk
      if: ${{ startsWith(matrix.target, 'android') }}
      run: cargo install cargo-ndk && rustup target install aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

    - name: Install clang for rquickjs bindgen
      if: ${{ startsWith(matrix.target, 'android') }}
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang libclang-dev

    - name: Build plugin for android
      if: ${{ startsWith(matrix.target, 'android') }}
      run: bash scripts/build-rust-android.sh ${{ matrix.abi }}

  generate-settings-schema:
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Install system deps
      run: sudo apt update && sudo apt install -y pkg-config libfontconfig1-dev libfreetype6-dev podman gettext && echo "CROSS_CONTAINER_ENGINE=podman" >> $GITHUB_ENV

    - name: Cache Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
 
    - name: Install Rust 1.97.1
      uses: actions-rs/toolchain@v1
      with:
        toolchain: 1.97.1
        profile: minimal
        components: rustfmt, clippy
        override: true

    - name: Setup bun
      uses: oven-sh/setup-bun@v2
      with:
        # bun.lock files use the v1 format (stable bun)
        bun-version: 1.3.14

    - name: Build settings schema
      run: bash scripts/generate-settings-schema.sh

    - name: Upload plugin as workflow artifact
      uses: actions/upload-artifact@v4
      with:
        name: settings.schema.json
        path: build/settings.schema.json
  
  release:
    runs-on: ubuntu-latest
    needs: [build, generate-settings-schema, prepare-release]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.release_action == 'publish' && github.ref == 'refs/heads/main' && needs.build.result == 'success' && needs.generate-settings-schema.result == 'success' && needs.prepare-release.result == 'success' }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
    - uses: actions/checkout@v3
      with:
        persist-credentials: true
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: "lts/*"
    - name: Install dependencies
      run: npm install
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: build
        merge-multiple: true
    - name: Combine android plugin zips
      run: |
        # The per-ABI android jobs all produce the same plugin zip (the
        # libserver.so lives in the companion app, not in the plugin), so
        # merge them back into a single rakuyomi-android.zip for release.
        if compgen -G "build/rakuyomi-android-*.zip" > /dev/null; then
          cp "$(ls build/rakuyomi-android-*.zip | head -1)" build/rakuyomi-android.zip
        fi
    - name: Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        HUSKY: 0
      run: npx semantic-release
